# games.rustema.app: Apache on the host proxies to 127.0.0.1:14050. Nothing else is published.
services:
  games-server:
    build: .
    image: games-server:local
    container_name: games-server
    restart: unless-stopped
    ports:
      - "127.0.0.1:14050:8080"
    environment:
      # Our own proxies: the docker gateway (Apache on the host) plus what the
      # host's proxy chain adds; set the rest in .env (never committed).
      TRUSTED_PROXIES: "${TRUSTED_PROXIES:-172.30.40.1,127.0.0.1}"
      BEHEER_MELDING_URL: "${BEHEER_MELDING_URL:-}"
      BEHEER_MELDING_TOKEN: "${BEHEER_MELDING_TOKEN:-}"
    volumes:
      - ./data:/data
    read_only: true
    tmpfs:
      - /tmp:size=16m
    user: "10001"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 64
    cpus: 0.5
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks: [games]

networks:
  games:
    ipam:
      config:
        - subnet: 172.30.40.0/24
          gateway: 172.30.40.1
